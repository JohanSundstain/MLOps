# Data sources: Sentinel-2 L2A scenes (STAC) and ESA WorldCover reference masks.
stac:
  url: https://earth-search.aws.element84.com/v1
  collection: sentinel-2-l2a
  # STAC asset name for every model band (Sentinel-2 L2A, 10 m resolution).
  bands:
    blue: blue
    green: green
    red: red
    nir: nir
  # Order of the channels in the input tensor of the network.
  band_order: [blue, green, red, nir]
  scl_asset: scl
  # Reject a scene when its whole-tile cloud cover is above this percentage.
  max_cloud_cover: 20
  # Search the best scene within +/- this many days around the target date.
  date_window_days: 45
  max_candidates: 50
  request_timeout: 60
  retries: 3
  # Fail on the first AOI without a suitable scene instead of skipping it.
  strict: false

worldcover:
  base_url: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map
  filename_template: ESA_WorldCover_10m_2021_v200_{tile}_Map.tif
  # WorldCover class of permanent water bodies.
  water_class: 80
  version: v200

# Sentinel-2 scene classification classes treated as invalid (clouds, shadows, no data, ...).
scl_invalid_classes: [0, 1, 3, 8, 9, 10, 11]

download:
  # Read a small window of every asset after the STAC search to fail fast on broken links.
  verify_access: true
  # Cache the full AOI stacks in data/raw/stacks (they are large, off by default).
  cache_stacks: false

dvc:
  # Pull data/processed with the DVC Python API when it is missing.
  enabled: true
  # Optional DVC remote name; empty means "the default remote from .dvc/config".
  remote: ""

patch:
  size: 256
  stride: 256
  # Keep patches whose water fraction is inside [min_water_fraction, max_water_fraction];
  # pure-water patches are dropped because they carry no information about the shoreline.
  min_water_fraction: 0.02
  max_water_fraction: 0.98
  # Share of all-land (negative) patches among the selected ones.
  negative_ratio: 0.3
  # Minimum share of cloud-free pixels in a patch.
  min_valid_fraction: 0.95
  # Upper bound on the number of positive patches taken from one scene.
  max_patches_per_scene: 18
  # Skip an AOI when more than this share of its pixels is invalid in the scene.
  max_invalid_fraction: 0.5

# Areas of interest: lakes in the south of Western Siberia (Novosibirsk, Omsk, Altai,
# Khakassia). bbox = [min_lon, min_lat, max_lon, max_lat] in EPSG:4326.
# `group` defines the group-wise split: patches of the same group never appear in two splits.
aois:
  - name: chany
    group: chany
    bbox: [77.35, 54.82, 77.75, 55.02]
    dates: ["2023-07-15", "2024-07-20"]
